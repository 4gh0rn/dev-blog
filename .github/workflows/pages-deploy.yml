name: Deploy to GitHub Pages

on:
  push:
    branches:
      - feat/ag/documentation_updates
  pull_request:
    branches:
      - feat/ag/documentation_updates
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build website
        run: npm run build
        env:
          BLOG_ENABLED: ${{ secrets.BLOG_ENABLED || 'true' }}
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL || 'https://4gh0rn.github.io' }}
          DEPLOYMENT_BRANCH: ${{ secrets.DEPLOYMENT_BRANCH || 'gh-pages' }}
          BASE_URL: ${{ secrets.BASE_URL || '/dev-blog/' }}
          GITHUB_ORG: ${{ secrets.GITHUB_ORG || '4gh0rn' }}
          GITHUB_PROJECT: ${{ secrets.GITHUB_PROJECT || 'dev-blog' }}

      - name: Upload Build Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
