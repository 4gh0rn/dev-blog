services:
  docusaurus-blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BLOG_ENABLED: ${BLOG_ENABLED:-false}
        DEPLOYMENT_URL: ${DEPLOYMENT_URL:-https://4gh0rn.github.io}
        DEPLOYMENT_BRANCH: ${DEPLOYMENT_BRANCH:-main}
        GITHUB_ORG: ${GITHUB_ORG:-4gh0rn}
        GITHUB_PROJECT: ${GITHUB_PROJECT:-dev-blog}
        BASE_URL: ${BASE_URL:-/dev-blog/}
    container_name: ${CONTAINER_NAME:-docusaurus-blog}
    ports:
      - "${HOST_PORT:-3000}:${CONTAINER_PORT:-80}"
    restart: unless-stopped
    networks:
      - ${NETWORK_NAME:-docusaurus-network}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost${HEALTH_CHECK_PATH:-/health} || exit 1",
        ]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-3s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-5s}
    deploy:
      resources:
        limits:
          cpus: ${CPU_LIMIT:-1.0}
          memory: ${MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${CPU_RESERVATION:-0.25}
          memory: ${MEMORY_RESERVATION:-128M}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  # Development service with hot-reload (use with --profile dev)
  docusaurus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${DEV_CONTAINER_NAME:-docusaurus-dev}
    ports:
      - "${DEV_HOST_PORT:-3001}:${DEV_CONTAINER_PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.docusaurus
    environment:
      - BLOG_ENABLED=${BLOG_ENABLED:-false}
      - DEPLOYMENT_URL=${DEPLOYMENT_URL:-https://4gh0rn.github.io}
      - DEPLOYMENT_BRANCH=${DEPLOYMENT_BRANCH:-main}
      - GITHUB_ORG=${GITHUB_ORG:-4gh0rn}
      - GITHUB_PROJECT=${GITHUB_PROJECT:-dev-blog}
      - BASE_URL=${BASE_URL:-/}
    command: npm start -- --host 0.0.0.0
    networks:
      - ${NETWORK_NAME:-docusaurus-network}
    deploy:
      resources:
        limits:
          cpus: ${DEV_CPU_LIMIT:-1.0}
          memory: ${DEV_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${DEV_CPU_RESERVATION:-0.25}
          memory: ${DEV_MEMORY_RESERVATION:-256M}
    profiles:
      - dev

networks:
  docusaurus-network:
    driver: bridge
